# ============================================================
# Project Academy — Configuration
# ============================================================

# --- Ollama / LLM ---
ollama_url: "http://localhost:11434"
model: "qwen2.5-coder:7b"
context_window: 8192
temperature: 0.3
request_timeout_sec: 300       # 5 min — 14B model cold-loads slowly on 6GB VRAM

# --- Schedule ---
daily_hour_cap: 8
rest_day: "sunday"            # no sprint generated on this day
intel_reminder_day: "friday"  # orchestrator appends intel reminder

# --- Faculty Weights ---
faculties:
  cpp:
    name: "C++ / Systems"
    weight: 0.35
    syllabus: "syllabus/syllabus_cpp.md"
  dsa:
    name: "DSA"
    weight: 0.25
    syllabus: "syllabus/syllabus_dsa.md"
  ai:
    name: "Edge AI / ML"
    weight: 0.15
    syllabus: "syllabus/syllabus_ai.md"
  scale:
    name: "Data & Scale"
    weight: 0.12
    syllabus: "syllabus/syllabus_scale.md"
  interview:
    name: "Interview Prep"
    weight: 0.13
    syllabus: "syllabus/syllabus_interview.md"

# --- Spaced Repetition (SM-2) ---
sr_initial_interval: 1        # days
sr_second_interval: 6         # days
sr_minimum_ef: 1.3            # easiness factor floor
sr_initial_ef: 2.5            # starting easiness factor

# --- Paths ---
paths:
  state_dir: "state"
  archive_dir: "archive"
  syllabus_dir: "syllabus"
  prompts_dir: "prompts"
  logs_dir: "logs"

# --- Quarterly Review ---
quarterly_review_months: [3, 6, 9, 12]  # months from start

# --- Target Companies (for Intel Friday reminder links) ---
target_companies:
  - name: "Tower Research Capital"
    careers_url: "https://www.tower-research.com/careers"
    tier: 1
  - name: "iRage Capital"
    careers_url: "https://www.iragecapital.com/careers"
    tier: 1
  - name: "IMC Trading"
    careers_url: "https://www.imc.com/careers"
    tier: 1
  - name: "Graviton Research"
    careers_url: "https://www.gravitontrading.com/careers"
    tier: 1
  - name: "WorldQuant"
    careers_url: "https://www.worldquant.com/career-listing/"
    tier: 1
  - name: "Morgan Stanley"
    careers_url: "https://www.morganstanley.com/people-opportunities/students-graduates"
    tier: 2
  - name: "Goldman Sachs"
    careers_url: "https://www.goldmansachs.com/careers"
    tier: 2
  - name: "Bloomberg"
    careers_url: "https://www.bloomberg.com/careers"
    tier: 2
  - name: "Google"
    careers_url: "https://www.google.com/about/careers"
